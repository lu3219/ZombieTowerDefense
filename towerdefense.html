<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Defensa Zombie</title>
<style>
  :root{
    --bg:#0f1b12;
    --panel:#182a1c;
    --panel-border:#2e4a33;
    --accent:#7bd45c;
    --accent-dark:#4a8a37;
    --text:#e8f5e0;
    --muted:#9db99a;
    --danger:#e05c5c;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef5ea;
      --panel:#ffffff;
      --panel-border:#c8dcc2;
      --text:#1c2a1a;
      --muted:#5a6e56;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1b12; --panel:#182a1c; --panel-border:#2e4a33; --text:#e8f5e0; --muted:#9db99a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    min-height:100vh;
  }
  h1{
    font-size:1.3rem;
    margin:0 0 12px 0;
    letter-spacing:0.5px;
  }
  #wrap{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
    max-width:920px;
  }
  #boardBox{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:10px;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  canvas{
    display:block;
    border-radius:8px;
    max-width:100%;
    height:auto;
    background:#3a5b3f;
  }
  #panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px;
    width:270px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .stats{
    display:flex;
    justify-content:space-between;
    font-size:0.95rem;
    gap:6px;
  }
  .stat{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:6px 8px;
    flex:1;
    text-align:center;
  }
  .stat b{display:block;font-size:1.1rem;}
  .turret-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.03);
    border:2px solid var(--panel-border);
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    color:var(--text);
    text-align:left;
    font-size:0.85rem;
    transition:border-color .15s, transform .1s;
    overflow:hidden;
  }
  .turret-btn:hover{transform:translateY(-1px);}
  .turret-btn.selected{border-color:var(--accent);background:rgba(123,212,92,0.12);}
  .turret-btn.affordable-no{opacity:0.55;}
  .turret-btn.locked{opacity:0.5;cursor:not-allowed;}
  .turret-btn.locked:hover{transform:none;}
  .turret-btn.just-unlocked{border-color:#ffd85e; animation:glow 1.4s ease-in-out infinite;}
  @keyframes glow{
    0%,100%{box-shadow:0 0 0 rgba(255,216,94,0);}
    50%{box-shadow:0 0 12px rgba(255,216,94,0.7);}
  }
  .lock-overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:0.78rem;
    color:#ddd;
    text-align:center;
    padding:0 8px;
  }
  .swatch{
    width:26px;height:26px;border-radius:6px;flex-shrink:0;
  }
  .turret-info{flex:1;}
  .turret-info .name{font-weight:600;}
  .turret-info .sub{color:var(--muted);font-size:0.78rem;}
  #waveBtn, #resetBtn{
    background:var(--accent-dark);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    margin-top:4px;
  }
  #waveBtn:hover, #resetBtn:hover{filter:brightness(1.1);}
  #waveBtn:disabled{opacity:0.6;cursor:not-allowed;filter:none;}
  #resetBtn{background:transparent;border:1px solid var(--panel-border);color:var(--muted);}
  #msg{
    min-height:20px;
    font-size:0.82rem;
    color:var(--danger);
    text-align:center;
  }
  #sellHint{
    font-size:0.72rem;
    color:var(--muted);
    text-align:center;
  }
  #overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;justify-content:center;
    z-index:10;
  }
  #overlay .box{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:24px 30px;
    text-align:center;
  }
  #overlay button{
    margin-top:12px;
    background:var(--accent-dark);
    color:#fff;border:none;border-radius:8px;
    padding:8px 18px;cursor:pointer;font-weight:600;
  }
</style>
</head>
<body>
<h1>🧟 Defensa Zombie</h1>
<div id="wrap">
  <div id="boardBox">
    <canvas id="game" width="640" height="440"></canvas>
  </div>
  <div id="panel">
    <div class="stats">
      <div class="stat">💰<b id="moneyStat">200</b></div>
      <div class="stat">❤️<b id="livesStat">10</b></div>
      <div class="stat">🏅<b id="waveStat">0</b></div>
    </div>

    <div id="turretList"></div>

    <button id="waveBtn">▶ Iniciar nivel 1</button>
    <button id="resetBtn">Reiniciar partida</button>
    <div id="msg"></div>
    <div id="sellHint">Clic en una torreta colocada para venderla (70% del costo)</div>
  </div>
</div>

<div id="overlay">
  <div class="box">
    <div id="overlayText" style="font-size:1.2rem;font-weight:700;margin-bottom:4px;"></div>
    <div id="overlaySub" style="color:var(--muted);font-size:0.9rem;"></div>
    <button onclick="location.reload()">Jugar de nuevo</button>
  </div>
</div>

<script>
(function(){
  const CELL = 40;
  const COLS = 16;
  const ROWS = 11;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Camino: lista de celdas (col,row) por donde caminan los zombies
  const pathCells = [
    [0,1],[1,1],[2,1],[3,1],[4,1],
    [4,2],[4,3],[4,4],[4,5],[4,6],
    [5,6],[6,6],[7,6],[8,6],[9,6],[10,6],
    [10,5],[10,4],[10,3],[10,2],
    [11,2],[12,2],[13,2],[14,2],[15,2],
    [15,3],[15,4],[15,5],[15,6],[15,7],
    [14,7],[13,7],[12,7],[11,7],
    [11,8],[11,9],
    [10,9],[9,9],[8,9],[7,9],[6,9],[5,9],[4,9],[3,9],[2,9],[1,9],[0,9]
  ];
  const pathSet = new Set(pathCells.map(c => c[0]+','+c[1]));
  const pathPixels = pathCells.map(c => ({x:c[0]*CELL+CELL/2, y:c[1]*CELL+CELL/2}));

  // Orden de aparición + nivel necesario para desbloquear (0 = disponible desde el inicio)
  const TURRET_ORDER = ['basic','cannon','sniper','freeze','fire','bomb','wind'];
  const TURRET_TYPES = {
    basic:  {cost:50,  damage:8,  range:95,  cooldown:35,  color:'#6fb3e0', dark:'#3d7ea6', label:'Ballesta',        unlockLevel:0, sub:'Costo 50 · Daño 8 · Rápida'},
    cannon: {cost:100, damage:22, range:80,  cooldown:65,  color:'#e0a86f', dark:'#a66d38', label:'Cañón',           unlockLevel:1, sub:'Costo 100 · Daño 22 · Media'},
    sniper: {cost:160, damage:55, range:220, cooldown:110, color:'#c76fe0', dark:'#8a3ea6', label:'Francotirador',   unlockLevel:3, sub:'Costo 160 · Daño 55 · Largo alcance'},
    freeze: {cost:140, damage:5,  range:110, cooldown:55,  color:'#66d9e8', dark:'#2f8fa8', label:'Torre de Hielo',  unlockLevel:5, sub:'Costo 140 · Congela y ralentiza', slowFactor:0.35, slowDuration:100},
    fire:   {cost:150, damage:6,  range:100, cooldown:45,  color:'#ff9040', dark:'#b3541a', label:'Torre de Fuego',  unlockLevel:7, sub:'Costo 150 · Quemadura continua', burnDamage:4, burnDuration:160},
    bomb:   {cost:200, damage:0,  range:0,   cooldown:0,   color:'#ff5e3a', dark:'#8a2e1a', label:'Torre Bomba',     unlockLevel:9, sub:'Costo 200 · Explota 1 vez (radio 4x4)', triggerRange: CELL*1.3, blastHalf: CELL*2},
    wind:   {cost:150, damage:0,  range:130, cooldown:90,  color:'#cbd9e6', dark:'#6f89a3', label:'Torre de Viento', unlockLevel:11, sub:'Costo 150 · Empuja zombies hacia atrás', pushAmount:2.2}
  };

  let money = 200;
  let lives = 10;
  let level = 0;
  let selectedType = null;
  let unlocked = new Set(['basic']);
  let justUnlocked = new Set();
  let turrets = []; // {col,row,type,cooldownLeft,x,y}
  let zombies = []; // {pos,hp,maxHp,armor,x,y,speed,slowTimer,slowFactor,burnTimer,burnDamagePerTick,burnTickCounter}
  let projectiles = []; // {x,y,tx,ty,color,life}
  let effects = []; // partículas simples (hielo/fuego) {x,y,color,life,maxLife}
  let waveActive = false;
  let spawnQueue = 0;
  let spawnTimer = 0;
  let gameOver = false;

  const moneyStat = document.getElementById('moneyStat');
  const livesStat = document.getElementById('livesStat');
  const waveStat = document.getElementById('waveStat');
  const msgEl = document.getElementById('msg');
  const waveBtn = document.getElementById('waveBtn');
  const turretList = document.getElementById('turretList');

  function isPath(col,row){ return pathSet.has(col+','+row); }

  function showMsg(t){
    msgEl.textContent = t;
    clearTimeout(showMsg._t);
    showMsg._t = setTimeout(()=>{ msgEl.textContent=''; }, 2600);
  }

  // ---- Construcción dinámica de la lista de torretas ----
  function buildTurretList(){
    turretList.innerHTML = '';
    TURRET_ORDER.forEach(type=>{
      const def = TURRET_TYPES[type];
      const btn = document.createElement('div');
      btn.className = 'turret-btn';
      btn.dataset.type = type;
      const isUnlocked = unlocked.has(type);
      if(!isUnlocked) btn.classList.add('locked');
      if(justUnlocked.has(type)) btn.classList.add('just-unlocked');
      if(selectedType === type) btn.classList.add('selected');

      btn.innerHTML = `
        <div class="swatch" style="background:${def.color};"></div>
        <div class="turret-info">
          <div class="name">${def.label}</div>
          <div class="sub">${def.sub}</div>
        </div>
      `;
      if(!isUnlocked){
        const overlay = document.createElement('div');
        overlay.className = 'lock-overlay';
        overlay.textContent = '🔒 Superá el nivel ' + def.unlockLevel;
        btn.appendChild(overlay);
      }
      btn.addEventListener('click', ()=>{
        if(!unlocked.has(type)){ showMsg('Todavía no desbloqueaste esa torreta'); return; }
        justUnlocked.delete(type);
        if(selectedType === type){ selectedType = null; }
        else { selectedType = type; }
        buildTurretList();
        updateStats();
      });
      turretList.appendChild(btn);
    });
  }

  document.getElementById('resetBtn').addEventListener('click', ()=>location.reload());

  // ---- Colocar / vender torretas ----
  canvas.addEventListener('click', (e)=>{
    if(gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const col = Math.floor(mx / CELL);
    const row = Math.floor(my / CELL);
    if(col<0||col>=COLS||row<0||row>=ROWS) return;

    const existing = turrets.find(t=>t.col===col && t.row===row);
    if(existing){
      const refund = Math.floor(TURRET_TYPES[existing.type].cost * 0.7);
      money += refund;
      turrets = turrets.filter(t=>t!==existing);
      showMsg('Torreta vendida (+'+refund+')');
      updateStats();
      return;
    }

    if(!selectedType) { showMsg('Elegí un tipo de torreta primero'); return; }
    if(isPath(col,row)){ showMsg('No podés construir sobre el camino'); return; }

    const def = TURRET_TYPES[selectedType];
    if(money < def.cost){ showMsg('No tenés suficiente dinero'); return; }

    money -= def.cost;
    turrets.push({
      col,row,type:selectedType,
      cooldownLeft:0,
      x: col*CELL+CELL/2, y: row*CELL+CELL/2
    });
    updateStats();
  });

  // ---- Niveles ----
  waveBtn.addEventListener('click', ()=>{
    if(waveActive || gameOver) return;
    level++;
    waveActive = true;
    spawnQueue = 5 + level*2;
    spawnTimer = 0;
    waveBtn.disabled = true;
    waveBtn.textContent = 'Nivel en curso...';
    updateStats();
  });

  function spawnZombie(){
    const baseHp = 30 + (level-1)*12;
    const armor = 1 + Math.floor(level/4); // el casco: resistencia que absorbe daño plano
    zombies.push({
      pos:0,
      hp: baseHp,
      maxHp: baseHp,
      armor: armor,
      speed: 0.55 + Math.min(level*0.03, 0.6),
      x: pathPixels[0].x,
      y: pathPixels[0].y,
      bob: Math.random()*Math.PI*2,
      slowTimer:0, slowFactor:1,
      burnTimer:0, burnDamagePerTick:0, burnTickCounter:0
    });
  }

  function updateZombiePosition(z, speedMultiplier){
    const idx = Math.floor(z.pos);
    const frac = z.pos - idx;
    if(idx >= pathPixels.length-1){
      z.x = pathPixels[pathPixels.length-1].x;
      z.y = pathPixels[pathPixels.length-1].y;
      return true;
    }
    const a = pathPixels[idx];
    const b = pathPixels[idx+1];
    z.x = a.x + (b.x-a.x)*frac;
    z.y = a.y + (b.y-a.y)*frac;
    return false;
  }

  function checkUnlocks(clearedLevel){
    let unlockedSomething = false;
    TURRET_ORDER.forEach(type=>{
      const def = TURRET_TYPES[type];
      if(!unlocked.has(type) && def.unlockLevel>0 && def.unlockLevel<=clearedLevel){
        unlocked.add(type);
        justUnlocked.add(type);
        unlockedSomething = true;
        showMsg('¡Nueva torreta desbloqueada: ' + def.label + '!');
      }
    });
    if(unlockedSomething) buildTurretList();
  }

  function updateStats(){
    moneyStat.textContent = money;
    livesStat.textContent = lives;
    waveStat.textContent = level;
    document.querySelectorAll('.turret-btn').forEach(btn=>{
      const def = TURRET_TYPES[btn.dataset.type];
      if(unlocked.has(btn.dataset.type)){
        btn.classList.toggle('affordable-no', money < def.cost);
      }
    });
  }

  function distance(ax,ay,bx,by){
    return Math.hypot(ax-bx, ay-by);
  }

  function killZombie(z){
    zombies = zombies.filter(zz=>zz!==z);
    money += 4 + Math.floor(level/2);
    updateStats();
  }

  function gameLoop(){
    if(!gameOver){
      // spawn
      if(waveActive){
        spawnTimer--;
        if(spawnTimer<=0 && spawnQueue>0){
          spawnZombie();
          spawnQueue--;
          spawnTimer = 32;
        }
        if(spawnQueue<=0 && zombies.length===0){
          waveActive = false;
          const reward = 40 + level*5;
          money += reward;
          checkUnlocks(level);
          waveBtn.disabled = false;
          waveBtn.textContent = '▶ Iniciar nivel '+(level+1);
          showMsg('Nivel ' + level + ' superado! +' + reward + ' monedas');
          updateStats();
        }
      }

      // mover zombies + efectos de hielo/fuego
      for(let i=zombies.length-1;i>=0;i--){
        const z = zombies[i];

        // quemadura
        if(z.burnTimer>0){
          z.burnTimer--;
          z.burnTickCounter++;
          if(z.burnTickCounter>=20){
            z.burnTickCounter = 0;
            z.hp -= z.burnDamagePerTick;
            effects.push({x:z.x,y:z.y-14,color:'#ff9040',life:18,maxLife:18});
          }
        }
        if(z.hp<=0){ killZombie(z); continue; }

        // ralentización
        let speedMult = 1;
        if(z.slowTimer>0){ z.slowTimer--; speedMult = z.slowFactor; }

        z.pos += z.speed * 0.05 * speedMult;
        z.bob += 0.25 * speedMult;
        const finished = updateZombiePosition(z);
        if(finished){
          zombies.splice(i,1);
          lives--;
          updateStats();
          if(lives<=0){ endGame(false); }
        }
      }

      // torretas disparan
      const turretsToRemove = [];
      turrets.forEach(t=>{
        const def = TURRET_TYPES[t.type];

        // Torre Bomba: explota una sola vez cuando un zombi se acerca
        if(t.type==='bomb'){
          let triggered = false;
          zombies.forEach(z=>{
            if(distance(t.x,t.y,z.x,z.y) <= def.triggerRange) triggered = true;
          });
          if(triggered){
            const caught = zombies.filter(z =>
              Math.abs(z.x - t.x) <= def.blastHalf && Math.abs(z.y - t.y) <= def.blastHalf
            );
            caught.forEach(z => killZombie(z));
            effects.push({x:t.x,y:t.y,color:'#ff5e3a',life:24,maxLife:24,big:true});
            turretsToRemove.push(t);
          }
          return;
        }

        // Torre de Viento: empuja a todos los zombies en su radio hacia atrás
        if(t.type==='wind'){
          if(t.cooldownLeft>0){ t.cooldownLeft--; return; }
          let pushedAny = false;
          zombies.forEach(z=>{
            if(distance(t.x,t.y,z.x,z.y) <= def.range){
              z.pos = Math.max(0, z.pos - def.pushAmount);
              updateZombiePosition(z);
              pushedAny = true;
            }
          });
          if(pushedAny){
            t.cooldownLeft = def.cooldown;
            effects.push({x:t.x,y:t.y,color:'#cbd9e6',life:20,maxLife:20,big:true});
          }
          return;
        }

        if(t.cooldownLeft>0) t.cooldownLeft--;
        if(t.cooldownLeft<=0){
          let target=null, bestDist=Infinity;
          zombies.forEach(z=>{
            const d = distance(t.x,t.y,z.x,z.y);
            if(d<=def.range && d<bestDist){ bestDist=d; target=z; }
          });
          if(target){
            t.cooldownLeft = def.cooldown;
            const dmg = Math.max(1, def.damage - target.armor);
            target.hp -= dmg;
            projectiles.push({x:t.x,y:t.y,tx:target.x,ty:target.y,color:def.color,life:6});

            if(t.type==='freeze'){
              target.slowTimer = def.slowDuration;
              target.slowFactor = def.slowFactor;
              effects.push({x:target.x,y:target.y,color:'#a8ecf5',life:14,maxLife:14});
            }
            if(t.type==='fire'){
              target.burnTimer = Math.max(target.burnTimer, def.burnDuration);
              target.burnDamagePerTick = def.burnDamage;
            }

            if(target.hp<=0){ killZombie(target); }
          }
        }
      });
      if(turretsToRemove.length){
        turrets = turrets.filter(t => !turretsToRemove.includes(t));
      }

      // proyectiles y efectos
      projectiles.forEach(p=>p.life--);
      projectiles = projectiles.filter(p=>p.life>0);
      effects.forEach(fx=>fx.life--);
      effects = effects.filter(fx=>fx.life>0);
    }

    draw();
    requestAnimationFrame(gameLoop);
  }

  function endGame(win){
    gameOver = true;
    const overlay = document.getElementById('overlay');
    const text = document.getElementById('overlayText');
    const sub = document.getElementById('overlaySub');
    text.textContent = win ? '¡Ganaste!' : '💀 Game Over';
    sub.textContent = 'Llegaste hasta el nivel ' + level;
    overlay.style.display = 'flex';
  }

  // ---- Dibujo ----
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const x=c*CELL, y=r*CELL;
        const onPath = isPath(c,r);
        if(onPath){
          ctx.fillStyle = '#8a7550';
        } else {
          ctx.fillStyle = (r+c)%2===0 ? '#4a7a4f' : '#436e48';
        }
        ctx.fillRect(x,y,CELL,CELL);
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        if(isPath(c,r)) continue;
        const seed = (c*31+r*17)%7;
        if(seed===0){
          ctx.beginPath();
          ctx.arc(c*CELL+12, r*CELL+28, 3, 0, Math.PI*2);
          ctx.arc(c*CELL+26, r*CELL+14, 3, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    pathCells.forEach(([c,r])=>{
      ctx.strokeRect(c*CELL,r*CELL,CELL,CELL);
    });

    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    for(let c=0;c<=COLS;c++){
      ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,ROWS*CELL); ctx.stroke();
    }
    for(let r=0;r<=ROWS;r++){
      ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(COLS*CELL,r*CELL); ctx.stroke();
    }

    if(hoverCell && selectedType && !isPath(hoverCell.col,hoverCell.row)){
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(hoverCell.col*CELL,hoverCell.row*CELL,CELL,CELL);
      ctx.strokeStyle = TURRET_TYPES[selectedType].color;
      ctx.lineWidth=2;
      ctx.strokeRect(hoverCell.col*CELL+1,hoverCell.row*CELL+1,CELL-2,CELL-2);
      ctx.lineWidth=1;
    }

    // torretas
    turrets.forEach(t=>{
      const def = TURRET_TYPES[t.type];
      ctx.save();
      ctx.translate(t.x,t.y);
      ctx.fillStyle = def.dark;
      ctx.beginPath();
      ctx.arc(0,0,15,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle = def.color;
      ctx.beginPath();
      ctx.arc(0,0,10,0,Math.PI*2);
      ctx.fill();

      // ícono de habilidad especial
      const ICONS = {freeze:'❄', fire:'🔥', bomb:'💣', wind:'🌀'};
      const NO_BARREL = ['freeze','fire','bomb','wind'];
      if(ICONS[t.type]){
        ctx.fillStyle='#fff';
        ctx.font='10px sans-serif';
        ctx.textAlign='center';
        ctx.fillText(ICONS[t.type], 0, 3);
      }

      let target=null,bestDist=Infinity;
      zombies.forEach(z=>{
        const d=distance(t.x,t.y,z.x,z.y);
        if(d<=def.range && d<bestDist){bestDist=d;target=z;}
      });
      if(target && !NO_BARREL.includes(t.type)){
        const ang = Math.atan2(target.y-t.y, target.x-t.x);
        ctx.rotate(ang);
        ctx.fillStyle = '#333';
        ctx.fillRect(0,-3,16,6);
      }
      ctx.restore();
    });

    // zombies
    zombies.forEach(z=>{
      const bobY = Math.sin(z.bob)*1.5;
      ctx.save();
      ctx.translate(z.x, z.y+bobY);

      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0,11,9,3,0,0,Math.PI*2);
      ctx.fill();

      const burning = z.burnTimer>0;
      const frozen = z.slowTimer>0;
      const bodyColor = burning ? '#c96b3a' : (frozen ? '#7fb0c9' : '#5a8f4a');
      const armColor = burning ? '#a5522a' : (frozen ? '#5f8ba3' : '#4a7a3a');
      const headColor = burning ? '#d98a55' : (frozen ? '#8fc0d8' : '#6ca85a');

      ctx.fillStyle = bodyColor;
      ctx.fillRect(-6,-2,12,12);
      ctx.fillStyle = armColor;
      ctx.fillRect(-9,0,3,8);
      ctx.fillRect(6,0,3,8);
      ctx.fillStyle = '#3f3f3f';
      ctx.fillRect(-5,10,4,5);
      ctx.fillRect(1,10,4,5);
      ctx.fillStyle = headColor;
      ctx.beginPath();
      ctx.arc(0,-6,6,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#c0392b';
      ctx.fillRect(-3,-7,2,2);
      ctx.fillRect(2,-7,2,2);
      // casco
      ctx.fillStyle = '#8a8f99';
      ctx.beginPath();
      ctx.arc(0,-8,7,Math.PI,0);
      ctx.fill();
      ctx.fillRect(-7,-8,14,3);
      ctx.fillStyle='#6b7078';
      ctx.fillRect(-1,-14,2,3);

      if(frozen){
        ctx.fillStyle='rgba(150,220,240,0.35)';
        ctx.beginPath();
        ctx.arc(0,-2,11,0,Math.PI*2);
        ctx.fill();
      }
      if(burning){
        ctx.font='9px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('🔥',0,-16);
      }

      const w=20;
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.fillRect(-w/2,-20,w,4);
      ctx.fillStyle= burning ? '#ff9040' : '#7bd45c';
      ctx.fillRect(-w/2,-20,w*Math.max(0,z.hp/z.maxHp),4);

      ctx.restore();
    });

    projectiles.forEach(p=>{
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.tx,p.ty);
      ctx.stroke();
      ctx.lineWidth = 1;
    });

    effects.forEach(fx=>{
      const alpha = fx.life/fx.maxLife;
      ctx.fillStyle = fx.color.startsWith('#') ? hexToRgba(fx.color, alpha*0.6) : fx.color;
      const maxR = fx.big ? 45 : 10;
      const minR = fx.big ? 14 : 4;
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, maxR*(1-alpha)+minR, 0, Math.PI*2);
      ctx.fill();
    });

    if(hoverCell){
      const t = turrets.find(tt=>tt.col===hoverCell.col && tt.row===hoverCell.row);
      if(t){
        const def = TURRET_TYPES[t.type];
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(t.x,t.y,def.range,0,Math.PI*2);
        ctx.stroke();
      }
    }
  }

  function hexToRgba(hex, alpha){
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  let hoverCell = null;
  canvas.addEventListener('mousemove',(e)=>{
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const col = Math.floor(mx / CELL);
    const row = Math.floor(my / CELL);
    if(col>=0&&col<COLS&&row>=0&&row<ROWS) hoverCell = {col,row};
    else hoverCell = null;
  });
  canvas.addEventListener('mouseleave',()=>{hoverCell=null;});

  buildTurretList();
  updateStats();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
